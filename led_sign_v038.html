<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>My LED Sign V0.3.8</title>
<style>
:root{
  --bg:#eef1f7;--panel:#ffffff;--field:#f6f8fc;--text:#10162a;--muted:#5a6782;--line:#c9d1e0;--pill:#e6ebf4;--accent:#1f8fd0;--accentText:#ffffff;--frame:#c4ccdb;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b1020;--panel:#151e31;--field:#0b1425;--text:#eef3ff;--muted:#aab7d0;--line:#485674;--pill:#202d46;--accent:#40b9ef;--accentText:#071324;--frame:#26334c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0b1020;--panel:#151e31;--field:#0b1425;--text:#eef3ff;--muted:#aab7d0;--line:#485674;--pill:#202d46;--accent:#40b9ef;--accentText:#071324;--frame:#26334c;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Thai","Noto Sans",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:auto;padding:0 16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:10px}
h1{font-size:23px;margin:0}
.ver{font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.cdot{display:inline-block;box-sizing:content-box;width:8px;height:8px;border:3px solid #000;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.tag{color:var(--muted);font-size:13px}
.langsel{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 8px;max-width:46%}
.preview{position:relative;background:#000;border:2px solid var(--frame);border-radius:16px;overflow:hidden;aspect-ratio:16/8;touch-action:manipulation}
.preview canvas{width:100%;height:100%;display:block;background:#000}
.preview .tap{position:absolute;right:9px;bottom:9px;background:#20283cc9;border:1px solid #536079;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0 0}
.field{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}
.field .val{font-weight:400;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
textarea{width:100%;min-height:80px;resize:vertical;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.range{width:100%;accent-color:var(--accent)}
.range:disabled{opacity:.4}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--pill);color:var(--text);border-radius:999px;padding:6px 11px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;background:var(--pill);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:14px}
#mode button{flex:1 1 30%}
.chips.emo button{font-size:24px;padding:4px 10px;line-height:1.3}
.seg.off{opacity:.45}
.seg button.on{background:var(--field);color:var(--text);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch.active{outline:3px solid var(--text);outline-offset:2px}
.swatch.custom{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text);cursor:pointer;background:var(--field);border:2px dashed var(--muted)}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.check{display:flex;gap:9px;align-items:center;margin-top:13px;font-size:14px}
.check input{width:19px;height:19px;accent-color:var(--accent)}
.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.pill{border:1px solid var(--line);background:var(--pill);color:var(--text);border-radius:10px;padding:11px 14px}
.primary{background:var(--accent);color:var(--accentText);border:none;font-weight:800}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved .item{display:flex}
.saved .item .pill{border-radius:10px 0 0 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved .item .del{border-radius:0 10px 10px 0;border-left:0}
.empty{color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);margin:15px 2px 30px;line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#display{display:none;position:fixed;inset:0;z-index:50;background:#000}
#display canvas{width:100%;height:100%;display:block}
#exit{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));background:#263145dd;color:#fff;border:1px solid #57677c;border-radius:10px;padding:10px 12px;opacity:0;transition:opacity .2s;pointer-events:none}
#exit.show{opacity:1;pointer-events:auto}
#toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#263145dd;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
body.show #display{display:block}
body.show{overflow:hidden}
@media (min-width:600px){.preview{aspect-ratio:16/6}}
@media (prefers-reduced-motion:reduce){#exit,#toast{transition:none}}
</style>
</head>
<body>
<header class="wrap">
  <div><h1>✨ My LED Sign <span class="ver">V0.3.8</span></h1><div class="tag" data-i="tag"></div></div>
  <select class="langsel" id="lang" aria-label="Language"></select>
</header>

<main class="wrap">
  <div class="preview"><canvas id="preview"></canvas><button class="tap" id="previewFull" data-i="full"></button></div>

  <div class="panel">
    <label class="field" for="message" data-i="msg"></label>
    <textarea id="message" maxlength="300"></textarea>

    <label class="field" data-i="tests"></label>
    <div class="chips" id="tests"></div>

    <label class="field" data-i="emo"></label>
    <div class="chips emo" id="emojis"></div>

    <label class="field" data-i="mode"></label>
    <div class="seg" id="mode">
      <button data-v="left" data-i="mLeft"></button><button data-v="right" data-i="mRight"></button><button data-v="still" data-i="mStill"></button>
      <button data-v="up" data-i="mUp"></button><button data-v="down" data-i="mDown"></button>
    </div>
    <div class="note" id="modeNote"></div>
    <label class="check"><input type="checkbox" id="paging"> <span data-i="paging"></span></label>

    <label class="field" data-i="fx"></label>
    <div class="seg" id="fx"><button data-v="none" data-i="fxNone"></button><button data-v="pulse" data-i="fxPulse"></button><button data-v="bounce" data-i="fxBounce"></button><button data-v="twinkle" data-i="fxTwinkle"></button></div>

    <label class="field" data-i="look"></label>
    <div class="seg" id="style"><button data-v="dots" data-i="dots"></button><button data-v="smooth" data-i="smooth"></button></div>

    <label class="field" data-i="dot"></label>
    <div class="seg" id="dot"><button data-v="fine" data-i="fine"></button><button data-v="medium" data-i="med"></button><button data-v="large" data-i="large"></button></div>

    <label class="field" data-i="color"></label>
    <div class="swatches" id="swatches"></div>

    <label class="field" data-i="bg"></label>
    <div class="swatches" id="bgswatches"></div>

    <div class="grid">
      <div><label class="field" for="speed"><span data-i="speed"></span> <span class="val" id="speedVal"></span></label>
        <input class="range" id="speed" type="range" min="1" max="100"></div>
      <div><label class="field" for="size"><span data-i="size"></span> <span class="val" id="sizeVal"></span></label>
        <input class="range" id="size" type="range" min="30" max="95"></div>
    </div>

    <label class="check"><input type="checkbox" id="mirror"> <span data-i="mirror"></span></label>

    <div class="buttons">
      <button class="pill primary" id="launch" data-i="show"></button>
      <button class="pill" id="save" data-i="save"></button>
      <button class="pill" id="reset" data-i="reset"></button>
    </div>

    <label class="field" data-i="saved"></label>
    <div class="saved" id="saved"></div>
  </div>
  <p class="foot"><span data-i="foot"></span></p>
</main>

<div id="display"><canvas id="screen"></canvas><button id="exit" data-i="exit"></button><div id="toast"></div></div>

/* ---------- จัดข้อความ: ตัดคำ ไม่แยกสระวรรณยุกต์ออกจากพยัญชนะ ---------- */
const FONT='system-ui,"Noto Sans Thai","Noto Sans Lao","Noto Sans Khmer","Noto Sans Myanmar","Noto Sans CJK JP","Noto Sans Arabic","Noto Sans",sans-serif';
const DOTROWS={fine:64,medium:48,large:34};
const MIN_DOTS=20;          // ตัวอักษรต้องสูงอย่างน้อยประมาณนี้ (นับเป็นเม็ดไฟ) ถึงจะอ่านไทยออก
const pageMs=lines=>{const n=chars(lines.join('')).length;return Math.max(3000,Math.min(10000,2200+n*110))};
const meas=document.createElement('canvas').getContext('2d');
let segWord=null,segChar=null;

const setFont=fs=>{meas.font=`700 ${fs}px ${FONT}`};
const tw=s=>meas.measureText(s).width;

function wrap(userLines,fs,maxW){

  userLines.forEach(L=>{wrapOne(L,maxW,out);out.hard[out.length-1]=true});
  if(!out.length)out.push(' ');

}
function wrapOne(L,maxW,out){
    if(!L.trim()){out.push('');return}
    if(tw(L)<=maxW){out.push(L);return}
    let cur='';
    words(L).forEach(w=>{
      if(tw((cur+w).trimEnd())<=maxW){cur+=w;return}
      if(cur.trim())out.push(cur.trimEnd());
      cur=w.trimStart();
      if(tw(cur)>maxW){ // คำเดียวยาวเกินบรรทัด: ตัดทีละตัวอักษรแบบรวมสระวรรณยุกต์
        let piece='';
        chars(cur).forEach(g=>{if(piece&&tw(piece+g)>maxW){out.push(piece);piece=g}else piece+=g});

}
const RTLCH=/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/,LETTER=/\p{L}/u;

    return{s,dir,w:has?m.width:0,a:Math.max(has?(m.actualBoundingBoxAscent||0):0,fs*.72),d:Math.max(has?(m.actualBoundingBoxDescent||0):0,fs*.22)}});
  const gap=fs*.2;let h=gap*(L.length-1);L.forEach(l=>h+=l.a+l.d);
  return{L,gap,h,w:Math.max(1,...L.map(l=>l.w)),fs};
}

let layoutCache={key:''};
function layout(W,H){
  const dots=state.style==='dots',eH=Math.min(H,W*.62);
  const step=dots?Math.max(3,Math.round(eH/(DOTROWS[state.dot]||48))):1;
  const key=[state.message,state.style,state.dot,state.size,state.mode,!!state.paging,W,H].join('|');
  if(layoutCache.key===key)return layoutCache;
  const fsMin=Math.min(dots?step*MIN_DOTS:eH*.14,H*.6);
  const sz=Number(state.size)/100,mode=state.mode;
  let user=(state.message||'').replace(/\r/g,'').split('\n');
  while(user.length>1&&!user[user.length-1].trim())user.pop();
  if(!user.join('').trim())user=[' '];
  const cols=Math.ceil(W/step),rows=Math.ceil(H/step);
  let fs,pages,blockW,blockH;
  if(mode==='left'||mode==='right'){
    fs=Math.max(fsMin,Math.min(eH*sz*.72,H*.75));
    const one=[user.filter(l=>l.trim()).join('      ')||' '];
    const st=stack(one,fs);
    pages=[one];blockW=Math.max(step,Math.ceil((st.w+fs*.4)/step)*step);blockH=rows*step;
  }else if(mode==='up'||mode==='down'){
    fs=Math.max(fsMin,Math.min(eH*sz*.42,H*.6));
    const ls=wrap(user,fs,W*.92),st=stack(ls,fs);
    pages=[ls];blockW=cols*step;blockH=Math.ceil((st.h+fs*.35)/step)*step;
  }else{ // หยุดนิ่ง: ขยายให้ใหญ่ที่สุด ถ้าเล็กกว่าขั้นต่ำ แบ่งหน้า
    const maxW=W*.94,maxH=H*.88;
    const s1=stack(user,100);const fsA=Math.floor(100*Math.min(maxW/s1.w,maxH/s1.h));
    const fits=f=>stack(wrap(user,f,maxW),f).h<=maxH;
    let best=0;
    const lowF=state.paging?fsMin:4;
    if(fits(lowF)){let lo=lowF,hi=Math.max(fsMin+1,Math.floor(maxH));for(let i=0;i<14;i++){const mid=(lo+hi)/2;if(fits(mid))lo=mid;else hi=mid}best=Math.floor(lo)}
    if(fsA>=lowF&&fsA*1.25>=best){fs=fsA;pages=[user]}
    else if(best){fs=best;pages=[wrap(user,fs,maxW)]}
    else{
      fs=fsMin;const all=wrap(user,fs,maxW),hard=all.hard||[],N=all.length;
      const st1=stack(all,fs),hh=st1.L.map(l=>l.a+l.d),g=st1.gap;
      const fitR=(i,j)=>{let h=g*(j-i-1);for(let k=i;k<j;k++)h+=hh[k];return h<=maxH||j-i===1};
      let n=0;for(let i=0;i<N;){let j=i+1;while(j<N&&fitR(i,j+1))j++;n++;i=j}
      // เกลี่ยหน้า: จำนวนหน้าเท่าเดิม แต่ให้แต่ละหน้ามีบรรทัดใกล้กัน และพยายามตัดหน้าตรงจบประโยค/บรรทัดที่พิมพ์เอง
      const avg=N/n,good=j=>hard[j-1]||/[.!?。！？؟…:;,،]$/.test((all[j-1]||'').trim());
      const INF=1e9,dp=[],from=[];for(let k=0;k<=n;k++){dp.push(new Array(N+1).fill(INF));from.push(new Array(N+1).fill(-1))}
      dp[0][0]=0;
      for(let k=1;k<=n;k++)for(let j=1;j<=N;j++)for(let i=j-1;i>=0;i--){
        if(!fitR(i,j))break;if(dp[k-1][i]>=INF)continue;
        const c=dp[k-1][i]+Math.pow(j-i-avg,2)+(j<N&&!good(j)?.6:0);
        if(c<dp[k][j]){dp[k][j]=c;from[k][j]=i}
      }

      if(dp[n][N]<INF){let j=N;for(let k=n;k>0;k--){const i=from[k][j];pages.unshift(all.slice(i,j));j=i}}
      else{for(let i=0;i<N;){let j=i+1;while(j<N&&fitR(i,j+1))j++;pages.push(all.slice(i,j));i=j}}
      pages=pages.map(p=>{while(p.length>1&&!p[0].trim())p.shift();return p});
    }

    // แต่ละหน้าขยายให้ใหญ่ที่สุดเท่าที่จอให้ (หน้าที่มีคำน้อยจะตัวใหญ่กว่า)

  }
  layoutCache={key,dots,step,fs,pages,pageFs:mode==='still'?pageFs:null,blockW,blockH,mode};
  return layoutCache;
}

/* ---------- วาดเม็ดไฟ ---------- */
const MAXCHUNK=4096;
const srcC=document.createElement('canvas'),srcX=srcC.getContext('2d',{willReadFrequently:true});
const miniC=document.createElement('canvas'),miniX=miniC.getContext('2d',{willReadFrequently:true});
let rasterCache=new Map(),rasterBase='',sprites=new Map(),spriteStep=0,unlitPattern=null,patternStep=0;
function hueRGB(h){h/=60;const f=n=>{const k=(n+h)%6;return Math.round(255*(1-Math.max(0,Math.min(k,4-k,1))))};return[f(5),f(3),f(1)]}

function sprite(rgb,step){
  if(spriteStep!==step){sprites.clear();spriteStep=step}
  const light=isLight(state.bg),key=rgb.join(',')+(light?'L':'');let s=sprites.get(key);if(s)return s;
  const size=Math.ceil(step*2.6),c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d'),m=size/2,[r,g,b]=rgb;
  const grd=x.createRadialGradient(m,m,0,m,m,m);
  grd.addColorStop(0,`rgba(${r},${g},${b},.5)`);grd.addColorStop(.42,`rgba(${r},${g},${b},.16)`);grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  // พื้นสว่าง: ไม่ใส่แสงเรือง (บนพื้นขาวแสงเรืองทำให้สีซีด) และเม็ดใหญ่ขึ้นนิดให้สีเข้ม

  x.beginPath();x.arc(m-step*.1,m-step*.1,step*.14,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.35)';x.fill();

// เม็ดไฟที่ดับ: อ่อนกว่าพื้นหลังเล็กน้อยถ้าพื้นมืด, เข้มกว่าเล็กน้อยถ้าพื้นสว่าง

function unlit(ctx,step){
  if(unlitPattern&&patternStep===step&&patternBg===state.bg)return unlitPattern;
  const c=document.createElement('canvas');c.width=c.height=step;const x=c.getContext('2d');
  x.beginPath();x.arc(step/2,step/2,step*.38,0,Math.PI*2);x.fillStyle=unlitColor(state.bg);x.fill();

function raster(W,H,scale=1){

  const sk=scale.toFixed(3);if(rasterCache.has(sk))return rasterCache.get(sk);
  const {dots,step,blockW,blockH}=lo,fs=(lo.pageFs?lo.pageFs[pg]:lo.fs)*scale,st=stack(lo.pages[pg],fs);
  const top=(lo.mode==='up'||lo.mode==='down')?fs*.15:(blockH-st.h)/2;
  const rainbow=state.color==='rainbow',base=rainbow?null:hexRGB(state.color);
  function drawText(c,x0,y0,fill){

}

/* ---------- เล่นภาพ ---------- */
let offset=0,last=0,rotated=false,lastPages=1,fxTime=0;
// ความเร็วเอฟเฟกต์: ใช้ตัวปรับความเร็วเดิม 42% = ปกติ, ช้าสุด 0.4 เท่า, เร็วสุด 2.5 เท่า
const fxRate=()=>{const s=Number(state.speed);return s<=42?.4+.6*(s-1)/41:1+1.5*(s-42)/58};
function paint(canvas,dt){
  const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  const CW=Math.max(1,Math.round(rect.width*dpr)),CH=Math.max(1,Math.round(rect.height*dpr));
  if(canvas.width!==CW||canvas.height!==CH){canvas.width=CW;canvas.height=CH;resetOffset=true}
  // จอเต็มแต่ยังเป็นแนวตั้งและมีการวิ่งแนวนอน: หมุนป้ายให้ใช้ด้านยาว
  const vertMode=state.mode==='up'||state.mode==='down';
  const rot=canvas.id==='screen'&&CH>CW*1.05&&!vertMode;
  if(rot!==rotated){rotated=rot;resetOffset=true}
  const W=rot?CH:CW,H=rot?CW:CH;
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=state.bg;ctx.fillRect(0,0,CW,CH);
  const lo=layout(W,H);
  if(state.mode==='still'&&lo.pages.length>1){pageClock+=dt;if(pageClock>=pageMs(lo.pages[page%lo.pages.length])){pageClock=0;page=(page+1)%lo.pages.length}}
  lastPages=state.mode==='still'?lo.pages.length:1;
  // เอฟเฟกต์ (เฉพาะหยุดนิ่ง): เต้น = ขยายเป็นจังหวะหัวใจ, เด้ง = กระโดดขึ้นลง, ระยิบ = สว่างหรี่ช้า ๆ
  let scale=1,bob=0,alpha=1;

    if(state.fx==='pulse'){const ph=(tt%1.1)/1.1,bump=(c,w)=>Math.max(0,1-Math.abs(ph-c)/w);
      const v=Math.min(1,bump(.1,.1)+.7*bump(.34,.1));scale=.88+.12*(Math.round(v*6)/6)}
    else if(state.fx==='bounce'){bob=-Math.abs(Math.sin(Math.PI*tt/.9))*H*.07}

  }else if(art.mode==='up'||art.mode==='down'){
    const gap=art.dots?Math.ceil(H*.35/step)*step:Math.round(H*.35),cycle=art.artH+gap,x=snap((W-art.artW)/2);
    if(resetOffset){offset=art.mode==='up'?H:-art.artH;resetOffset=false}
    offset+=(art.mode==='up'?-1:1)*v*dt/1000;
    if(Math.abs(offset)>cycle*4)offset=((offset%cycle)+cycle)%cycle;
    let y=((offset%cycle)+cycle)%cycle;if(y>0)y-=cycle;
    for(;y<H;y+=cycle)pos.push([x,y]);sx=x;sy=offset;
  }else{
    const x=snap((W-art.artW)/2),y=snap((H-art.artH)/2+bob);pos.push([x,y]);sx=x;sy=y;resetOffset=false;
  }
  if(rot)ctx.setTransform(0,1,-1,0,CW,0);
  if(state.mirror)ctx.transform(-1,0,0,1,W,0);
  if(art.dots){
    const p=unlit(ctx,step),m=q=>((q%step)+step)%step;
    p.setTransform(new DOMMatrix().translateSelf(m(sx),m(sy)));ctx.fillStyle=p;ctx.fillRect(0,0,W,H);
  }
  ctx.globalAlpha=alpha;
  pos.forEach(([x,y])=>art.chunks.forEach(ch=>{const dx=x+ch.x,dy=y+ch.y;if(dx+ch.w>=0&&dx<=W&&dy+ch.h>=0&&dy<=H)ctx.drawImage(ch.c,dx,dy)}));
  ctx.globalAlpha=1;
  if(art.mode==='still'&&art.pages>1){ // จุดบอกหน้า
    const r=Math.max(3,H*.012),gapP=r*3.4,start=W/2-(art.pages-1)*gapP/2,y=H-r*3;
    for(let i=0;i<art.pages;i++){ctx.beginPath();ctx.arc(start+i*gapP,y,r,0,Math.PI*2);const lt=isLight(state.bg);ctx.fillStyle=i===page%art.pages?(lt?'#000000':'#ffffff'):(lt?'#9a9a9a':'#4a4a4a');ctx.fill()}
  }
}
function tick(tm){
  const dt=Math.min(60,tm-(last||tm));last=tm;
  paint(document.body.classList.contains('show')?$('screen'):$('preview'),dt);
  requestAnimationFrame(tick);
}

/* ---------- เต็มจอ ---------- */
let wake=null,toastTimer=0;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
async function launch(){
  document.body.classList.add('show');resetOffset=true;page=0;pageClock=0;$('exit').classList.remove('show');
  try{await $('display').requestFullscreen()}catch(e){}
  const vert=state.mode==='up'||state.mode==='down';
  try{if(!vert&&screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
  if(saved.length>1)toast(t('hint'));
}
async function exit(){
  document.body.classList.remove('show');resetOffset=true;
  try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}
  try{screen.orientation.unlock()}catch(e){}
  try{if(wake)await wake.release()}catch(e){}wake=null;
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('show'))exit()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&document.body.classList.contains('show')&&navigator.wakeLock){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});
$('launch').onclick=launch;$('previewFull').onclick=launch;$('exit').onclick=e=>{e.stopPropagation();exit()};
$('display').addEventListener('click',e=>{
  if(e.target===$('exit'))return;
  const r=rotated?e.clientY/window.innerHeight:e.clientX/window.innerWidth;
  if((r<.33||r>.67)&&lastPages>1){
    page=r<.33?(page-1+lastPages)%lastPages:(page+1)%lastPages;pageClock=0;
  }else if((r<.33||r>.67)&&saved.length){
    let i=currentSaved();
    i=r<.33?(i<=0?saved.length-1:i-1):(i+1)%saved.length;
    openSaved(i);toast(saved[i].message);
  }else $('exit').classList.toggle('show');
});

/* ---------- ข้อความที่บันทึก ---------- */
// ป้ายที่กำลังแสดงอยู่คือรายการไหน ค้นทีละชั้น:
// 1) รายการที่มีครบ 10 ช่องและตรงทุกช่อง  2) รายการที่มีไม่ครบ (เช่นรายการเก่า) แต่ช่องที่มีตรงหมด
// 3) ข้อความตรงอย่างเดียว  ไม่เจอเลย = -1
// ก่อนค้น: ถ้ายังแสดงป้ายที่เพิ่งเปิดอยู่ (ยังไม่ได้แก้อะไร) ใช้ตำแหน่งนั้นเลย
// เพราะรายการเก่า LOVE ที่เปิดทับค่าสีฟ้า จะหน้าตาเหมือน LOVE สีฟ้าทุกอย่าง ค้นจากค่าแยกไม่ออก
const fits=(x,cur)=>SIGN_KEYS.every(k=>!(k in x)||x[k]===cur[k]);
function currentSaved(){
  const cur=signOf(state);
  if(saved[lastOpened]&&fits(saved[lastOpened],cur))return lastOpened;
  let i=saved.findIndex(x=>SIGN_KEYS.every(k=>(k in x)&&x[k]===cur[k]));
  if(i<0)i=saved.findIndex(x=>SIGN_KEYS.every(k=>!(k in x)||x[k]===cur[k]));
  if(i<0)i=saved.findIndex(x=>x.message===state.message);
  return i;
}
// รายการเก่า (มีแต่ข้อความ) เปลี่ยนแค่ข้อความ ค่าอื่นคงตามที่ตั้งอยู่ / รายการใหม่คืนค่าทั้งชุด
function openSaved(i){const sg=saved[i];if(!sg)return;state={...state,...sg};changed(true);lastOpened=i}
function renderSaved(){
  lastOpened=-1; // รายการเปลี่ยน (บันทึก/ลบ) ตำแหน่งเดิมใช้ไม่ได้แล้ว
  const root=$('saved');root.replaceChildren();
  if(!saved.length){const s=document.createElement('span');s.className='empty';s.textContent=t('none');root.appendChild(s);return}
  saved.forEach((sg,i)=>{
    const wrapEl=document.createElement('div');wrapEl.className='item';
    const b=document.createElement('button');b.className='pill';
    if(sg.color||sg.bg){const c=document.createElement('span');c.className='cdot'; // ไส้ = สีตัวอักษร, ขอบ = สีพื้นหลัง
      const col=sg.color||'#888888';c.style.background=col==='rainbow'?'linear-gradient(90deg,#f44,#fd3,#3f7,#4cf,#a6f)':col;
      c.style.borderColor=sg.bg||'#000000';b.appendChild(c)}
    b.appendChild(document.createTextNode(sg.message.replace(/\n/g,' / ').slice(0,40)));
    b.onclick=()=>openSaved(i);
    const d=document.createElement('button');d.className='pill del';d.textContent='×';d.setAttribute('aria-label','× '+sg.message);
    d.onclick=()=>{saved.splice(i,1);persistSaved();renderSaved()};
    wrapEl.append(b,d);root.appendChild(wrapEl);
  });
}
$('save').onclick=()=>{if(!state.message.trim())return alert(t('empty'));const sg=cleanSign(signOf(state));if(!sg)return;
  saved=saved.filter(x=>!sameSign(x,sg));saved.unshift(sg);saved=saved.slice(0,30);persistSaved();renderSaved()};
$('reset').onclick=()=>{const lang=state.lang;state={...DEF,lang};changed(true)};

applyLang();refresh();requestAnimationFrame(tick);
})();
</script>
